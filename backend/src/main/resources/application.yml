server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ai-video-studio-backend
  config:
    # 自动读取 backend/.env（不存在则忽略）；系统环境变量优先级更高。
    # 从 backend 目录启动用第一个，从仓库根目录启动用第二个。
    import:
      - optional:file:.env[.properties]
      - optional:file:./backend/.env[.properties]
  datasource:
    # 外部数据库可整体覆盖 DB_URL（含 SSL、超时等参数）；只改主机时用 DB_HOST / DB_PORT / DB_NAME
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_video}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:aivideo}
    password: ${DB_PASSWORD:aivideo123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: ${DB_POOL_INITIAL_SIZE:5}
      min-idle: ${DB_POOL_MIN_IDLE:5}
      max-active: ${DB_POOL_MAX_ACTIVE:20}
      max-wait: ${DB_POOL_MAX_WAIT:60000}
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 仅启用 stat；wall / mergeSql 需要额外引入 Guava，按需再开
      filters: stat
      connection-properties: druid.stat.slowSqlMillis=2000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis 6+ ACL 用户；只用 requirepass 时留空
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
  sql:
    init:
      # 外部数据库首次联通可设 DB_INIT_MODE=always，自动执行 classpath:db/schema.sql（幂等）
      mode: ${DB_INIT_MODE:never}
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

app:
  jwt:
    # 本地默认值仅用于开发，生产必须通过 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:aivideo-studio-dev-secret-key-please-change-in-production-2026}
    issuer: ai-video-studio
    access-token-ttl: ${JWT_ACCESS_TTL:PT30M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  # redis | memory（memory 仅用于无 Redis 的本地演示）
  token-store: ${TOKEN_STORE:redis}
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  storage:
    provider: ${STORAGE_PROVIDER:minio}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:aivideo}
    presigned-ttl: ${MINIO_PRESIGNED_TTL:PT15M}
  agentscope:
    # 默认关闭：使用 Mock ModelProvider，不发起真实模型调用
    enabled: ${AGENTSCOPE_ENABLED:false}
    model: ${AGENTSCOPE_MODEL:deepseek:deepseek-v4-flash}
    # 仅 enabled=true 时必填；为空会启动失败
    api-key: ${DEEPSEEK_API_KEY:}
    # 不要留空：空值可能回落到其他厂商默认地址
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # 单次模型调用超时；前端 axios 为 20s，这里需留出余量
    timeout: ${AGENTSCOPE_TIMEOUT:PT15S}
    max-iters: ${AGENTSCOPE_MAX_ITERS:3}
    max-attempts: ${AGENTSCOPE_MAX_ATTEMPTS:1}
    # 开启模型流式以获取 reasoning_content 等增量；关闭后仍展示工具/状态级步骤
    stream: ${AGENTSCOPE_STREAM:true}
    max-history-messages: 20
    # 工具确认挂起窗口；超时后确认接口返回 40900
    confirm-timeout: ${AGENTSCOPE_CONFIRM_TIMEOUT:PT5M}
    sys-prompt: >-
      你是 AI Video Studio 的视频创作助手。你擅长把用户的创意拆解为剧本、分镜和镜头参数。
      当用户要求生成视频、短片或镜头时，先调用 proposeVideoPrompt，
      提供 originalPrompt、optimizedPrompt 和 3-5 条可展示的 analysisSteps。
      优化提示词必须保留用户原意，分析步骤只描述理解、补全和镜头设计，不要输出隐藏思维链。
      这一阶段绝对不要调用 generateVideoClip；用户会选择原版或优化版并再次确认后，由系统调用视频工具。
      当用户要求分镜或剧本时，调用 generateStoryboard。
  video:
    # mock | seedance。dev 默认 mock；接入真实 Seedance 时切换为 seedance。
    provider: ${VIDEO_PROVIDER:mock}
    seedance:
      api-key: ${ARK_API_KEY:}
      base-url: ${SEEDANCE_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
      model: ${SEEDANCE_MODEL:doubao-seedance-2-5-260628}
      request-timeout: ${SEEDANCE_REQUEST_TIMEOUT:PT15S}
      # polling | callback | hybrid；本地默认 polling，生产推荐 hybrid。
      status-sync-mode: ${SEEDANCE_STATUS_SYNC_MODE:polling}
      poll-interval: ${SEEDANCE_POLL_INTERVAL:PT5S}
      callback-fallback-interval: ${SEEDANCE_CALLBACK_FALLBACK_INTERVAL:PT2M}
      callback-base-url: ${SEEDANCE_CALLBACK_BASE_URL:}
      callback-secret: ${SEEDANCE_CALLBACK_SECRET:}
      max-submit-attempts: ${SEEDANCE_MAX_SUBMIT_ATTEMPTS:3}
      max-batch-size: ${SEEDANCE_MAX_BATCH_SIZE:20}
      worker-lease: ${SEEDANCE_WORKER_LEASE:PT2M}
      pricing-version: ${SEEDANCE_PRICING_VERSION:seedance-2.5-2026-11}
      pricing:
        doubao-seedance-2-5-260628:
          480p: ${SEEDANCE_PRICE_480P:70.00}
          720p: ${SEEDANCE_PRICE_720P:70.00}
          1080p: ${SEEDANCE_PRICE_1080P:77.00}

logging:
  level:
    com.aivideo: info
    org.springframework.security: warn
